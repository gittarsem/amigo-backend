spring.application.name=amigo-backend

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.binaryTransfer=false

# IMPORTANT FOR SUPABASE
spring.datasource.hikari.auto-commit=false

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# =========================================================
# ML SERVICE (buddy recommendations)
# Leave ML_SERVICE_URL empty to always use the fallback ranking.
# =========================================================

ml.service.base-url=${ML_SERVICE_URL:}
ml.service.token=${ML_SERVICE_TOKEN:}
ml.service.timeout=${ML_SERVICE_TIMEOUT:1s}
ml.service.max-candidates=200

# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}

# =========================================================
# PROFILE
# =========================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}